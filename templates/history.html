<!DOCTYPE html>
<html>
<head>
    <title>History - StockAI</title>
    <link rel="stylesheet" href="/static/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 90%;
            margin: auto;
            margin-top: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* 🔙 Button */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #ff4da6;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #e60073;
            transform: scale(1.05);
        }

        /* 📦 Cards */
        .card {
            background: #1e1e1e;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 77, 166, 0.2);
            transition: 0.3s;
            animation: fadeIn 0.5s ease forwards;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(255, 77, 166, 0.5);
        }

        .row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 14px;
            color: #aaa;
        }

        .value {
            font-weight: 600;
        }

        /* 🎬 Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Empty */
        .empty {
            text-align: center;
            margin-top: 50px;
            color: #aaa;
        }

    </style>
</head>

<body>

<div class="container">

    <a href="/" class="back-btn">⬅ Back to Dashboard</a>

    <h1>📜 History</h1>

    {% if history %}

        {% for row in history %}
        <div class="card">
            <div class="row">
                <div>
                    <div class="tag">Stock</div>
                    <div class="value">{{row[0]}}</div>
                </div>

                <div>
                    <div class="tag">Price</div>
                    <div class="value">₹ {{row[1]}}</div>
                </div>

                <div>
                    <div class="tag">Prediction</div>
                    <div class="value">₹ {{row[2]}}</div>
                </div>

                <div>
                    <div class="tag">Confidence</div>
                    <div class="value">{{row[3]}}%</div>
                </div>

                <div>
                    <div class="tag">Date</div>
                    <div class="value">{{row[4]}}</div>
                </div>
            </div>
        </div>
        {% endfor %}

    {% else %}
        <div class="empty">
            <h2>No history found 🚫</h2>
            <p>Search some stocks to see data here</p>
        </div>
    {% endif %}

</div>

</body>
</html>
